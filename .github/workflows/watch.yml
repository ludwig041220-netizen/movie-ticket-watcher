name: Movie ticket watcher

on:
  schedule:
    # 每 10 分钟一次，避开整点和半点的 Actions 高峰。
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查，不发通知、不写入去重状态"
        required: false
        default: false
        type: boolean
      test_notification:
        description: "不检查票源，只发送一条测试通知"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: movie-ticket-watcher
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ github.event_name != 'schedule' || vars.WATCHER_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check ticket availability
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: |
          flag=""
          if [[ "$TEST_NOTIFICATION" == "true" ]]; then
            flag="--test-notification"
          elif [[ "$DRY_RUN" == "true" ]]; then
            flag="--dry-run"
          fi
          python -m movie_watcher.cli \
            --config config.yaml \
            --state runtime/state.json \
            --log-file runtime/watcher.log \
            $flag

      - name: Persist notification state and heartbeat
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.test_notification)) }}
        run: |
          if git diff --quiet -- runtime/state.json; then
            echo "State unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/state.json
          git commit -m "chore: persist movie watcher state [skip ci]"
          git push
